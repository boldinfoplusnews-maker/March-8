<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henok Abebe - Music App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            /* A nice deep blue gradient background */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 3rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
            width: 300px;
        }
        h1 { margin: 0; font-size: 24px; color: #fff; }
        p { opacity: 0.9; margin-bottom: 30px; font-size: 14px; }
        
        #playBtn {
            background-color: #ffffff;
            color: #1e3c72;
            border: none;
            padding: 20px 50px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        #playBtn:hover {
            transform: scale(1.08);
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Henok Abebe</h1>
        <p>Ema - Amharic Music</p>
        
        <audio id="myAudio">
            <source src="https://github.com/boldinfoplusnews-maker/March-8/raw/refs/heads/main/music.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <button id="playBtn" onclick="toggleMusic()">🎵 Play Music</button>
    </div>

    <script>
        function toggleMusic() {
            var audio = document.getElementById("myAudio");
            var btn = document.getElementById("playBtn");

            if (audio.paused) {
                audio.play();
                btn.innerHTML = "⏸ Pause Music";
            } else {
                audio.pause();
                btn.innerHTML = "🎵 Play Music";
            }
        }
    </script>

</body>
</html>
